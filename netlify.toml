[build]
  command = "npm run build:cjs"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."pac-slack"]
  timeout = 10

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
