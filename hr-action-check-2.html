          const isOpen = !e.status||e.status==="open";
          return (
            <div key={e.id} onClick={()=>setViewEntry(e)} style={{ background:"rgba(255,255,255,0.03)", border:`1px solid ${e.level==="risk"&&isOpen?"rgba(251,113,133,0.25)":"rgba(255,255,255,0.07)"}`, borderRadius:10, padding:"11px 14px", marginBottom:7, display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, cursor:"pointer" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10, minWidth:0 }}>
                <div style={{ width:7, height:7, borderRadius:"50%", background:col.text, flexShrink:0 }} />
                <div style={{ minWidth:0 }}>
                  <div style={{ fontWeight:600, fontSize:"0.85rem", display:"flex", alignItems:"center", gap:7, flexWrap:"wrap" }}>
                    {META[e.scenario].icon} {e.scenario}
                    <span style={{ fontSize:"0.65rem", fontWeight:700, textTransform:"uppercase", padding:"1px 6px", borderRadius:4, background:col.bg, color:col.text, border:`1px solid ${col.border}` }}>{levelLabel(e.level)}</span>
                  </div>
                  <div style={{ fontSize:"0.72rem", color:"#8899aa", marginTop:2 }}>
                    {e.managerName&&<span style={{ color:"rgba(248,250,252,0.55)", marginRight:6 }}>{e.managerName}</span>}
                    {e.date} · {e.time}
                    <span style={{ marginLeft:8, color:isOpen?statusColors.open:statusColors.resolved, fontWeight:600 }}>{isOpen?"Open":"Resolved"}</span>
                  </div>
                </div>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0 }}>
                <span style={{ fontSize:"0.72rem", color:"#8899aa" }}>View</span>
                <button onClick={ev=>{ ev.stopPropagation(); removeEntry(e.id); }} style={{ background:"none", border:"none", cursor:"pointer", color:"#fb7185", fontSize:"0.85rem", padding:"2px 4px", lineHeight:1, fontFamily:"inherit" }} title="Remove">×</button>
              </div>
            </div>
          );
        })
      )}
    </div>
  );
}

// ── Contextual policy snippet during questions ───────────────────────────
function PolicyHint({ policies, scenario }) {
  const [expanded, setExpanded] = useState(false);
  const relevant = policies.filter(p=>{ const cat=POLICY_CATEGORIES.find(c=>c.id===p.category); return cat&&(cat.scenarios.includes(scenario)||cat.id==="handbook"); });
  if (relevant.length===0) return null;
  return (
    <div style={{ background:"rgba(34,193,255,0.05)", border:"1px solid rgba(34,193,255,0.18)", borderRadius:10, padding:"10px 14px", marginBottom:14 }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:8 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <span style={{ fontSize:"0.82rem" }}>📄</span>
          <span style={{ fontSize:"0.8rem", fontWeight:600, color:"#22c1ff" }}>{relevant.length} company document{relevant.length!==1?"s":""} on file for this scenario</span>
        </div>
        <button onClick={()=>setExpanded(v=>!v)} style={{ fontSize:"0.71rem", color:"rgba(34,193,255,0.65)", cursor:"pointer", background:"none", border:"none", fontFamily:"inherit", padding:0, fontWeight:600 }}>
          {expanded?"Hide":"Show"}
        </button>
      </div>
      {expanded && (
        <div style={{ marginTop:10 }}>
          {relevant.map(doc=>(
            <div key={doc.id} style={{ background:"rgba(255,255,255,0.03)", borderRadius:8, padding:"9px 11px", marginBottom:6 }}>
              <div style={{ fontSize:"0.77rem", fontWeight:700, color:"#f8fafc", marginBottom:4 }}>{doc.name}</div>
              <div style={{ fontSize:"0.74rem", color:"rgba(248,250,252,0.6)", lineHeight:1.5, maxHeight:120, overflowY:"auto", whiteSpace:"pre-wrap", wordBreak:"break-word" }}>
                {doc.text.substring(0,600)}{doc.text.length>600?"...":""}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── Main App ─────────────────────────────────────────────────────────────
function App() {
  const [step, setStep]               = useState("pick");
  const [scenario, setScenario]       = useState(null);
  const [answers, setAnswers]         = useState([]);
  const [notes, setNotes]             = useState([]);
  const [hints, setHints]             = useState([]);
  const [history, setHistory]         = useState([]);
  const [copied, setCopied]           = useState(false);
  const [showDocTips, setShowDocTips] = useState(false);
  const [savedSession, setSavedSession]     = useState(null);
  const [showResumeBanner, setShowResume]   = useState(false);
  const [policies, setPolicies]       = useState([]);
  const [showPolicyLib, setShowPolicyLib]   = useState(false);
  const [emailAddr, setEmailAddr]           = useState("");
  const [emailStatus, setEmailStatus]       = useState("idle");
  const [hrEmailAddr, setHrEmailAddr]       = useState("");
  const [hrEmailStatus, setHrEmailStatus]   = useState("idle");
  const [showFollowUp, setShowFollowUp]     = useState(false);
  const [followUpEmail, setFollowUpEmail]   = useState("");
  const [followUpSet, setFollowUpSet]       = useState(false);
  const [checkHistory, setCheckHistory]     = useState([]);
  const [viewingPast, setViewingPast]       = useState(null);
  const [showHistory, setShowHistory]       = useState(false);
  const [employeeName, setEmployeeName]     = useState("");

  useEffect(() => { setPolicies(loadPolicies()); setCheckHistory(loadCheckHistory()); const e=loadHREmail(); if(e) setHrEmailAddr(e); }, []);
  useEffect(() => { const s=loadSession(); if(s&&s.scenario&&s.step&&s.step!=="pick"){setSavedSession(s);setShowResume(true);} }, []);
  useEffect(() => { if(step==="pick")return; saveSession({step,scenario,answers,notes,history}); }, [step,scenario,answers,notes,history]);

  const resumeSession = () => {
    if (!savedSession) return;
    const n=QS[savedSession.scenario].length;
    setScenario(savedSession.scenario); setStep(savedSession.step);
    setAnswers(savedSession.answers&&savedSession.answers.length===n?savedSession.answers:new Array(n).fill(null));
    setNotes(savedSession.notes&&savedSession.notes.length===n?savedSession.notes:new Array(n).fill(""));
    setHints(new Array(n).fill(false)); setHistory(savedSession.history||[]);
    setShowResume(false); setSavedSession(null);
  };
  const dismissResume = () => { setShowResume(false); setSavedSession(null); clearSession(); };

  const m  = scenario ? META[scenario] : null;
  const qs = scenario ? QS[scenario]   : [];
  const answered = answers.filter(a=>a!==null).length;
  const allDone  = qs.length>0 && answered===qs.length;
  const sc       = allDone ? computeScore(qs,answers) : null;
  const liveLevel = () => { if(!answered)return"neutral"; return computeScore(qs,answers).level; };

  const sendEmail = async () => {
    if (!sc || !emailAddr.includes("@")) return;
    setEmailStatus("sending");
    const ll2 = sc.level==="good"?"Low Risk":sc.level==="warn"?"Elevated Risk":"High Risk";
    const lines = [`HR Action Check`,`Scenario: ${scenario}`,`Result: ${ll2}`,`Date: ${new Date().toLocaleDateString()}`,employeeName.trim()?`Employee: ${employeeName.trim()}`:"",""].filter((l,i,a)=>!(l===""&&a[i-1]===""));
    qs.forEach((item,i)=>{ const a=answers[i]; const label=a==="yes"?"Yes":a==="no"?"No":"Don't know"; lines.push(`Q${i+1}${item.critical?" [Critical]":""}: ${item.q}`,`  Answer: ${label}`); if(notes[i])lines.push(`  Note: ${notes[i]}`); lines.push(""); });
    const st2=STEPS[scenario][sc.level]; lines.push("---","Next steps:"); st2.forEach((st,i)=>lines.push(`${i+1}. ${st}`));
    const rel=policies.filter(p=>{ const cat=POLICY_CATEGORIES.find(c=>c.id===p.category); return cat&&(cat.scenarios.includes(scenario)||cat.id==="handbook"); });
    if(rel.length){ lines.push("","--- Company documents referenced:"); rel.forEach(p=>lines.push(`- ${p.name} (${POLICY_CATEGORIES.find(c=>c.id===p.category)?.label})`)); }
    lines.push("","General guidance only — not legal advice.");
    try {
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email:emailAddr, subject:`${scenario} — ${ll2}`, message:lines.join("\n"), name:"HR Action Check", email:emailAddr });
      setEmailStatus("sent");
    } catch(e) { setEmailStatus("error"); }
  };

  const sendToHR = async () => {
    if (!sc || !hrEmailAddr.includes("@")) return;
    setHrEmailStatus("sending");
    const ll2 = sc.level==="good"?"Low Risk":sc.level==="warn"?"Elevated Risk":"High Risk";
    const lines = [`HR Action Check — Manager Submission`,`Scenario: ${scenario}`,`Result: ${ll2}`,`Date: ${new Date().toLocaleDateString()}`,employeeName.trim()?`Manager: ${employeeName.trim()}`:"",""];
    qs.forEach((item,i)=>{ const a=answers[i]; const label=a==="yes"?"Yes":a==="no"?"No":"Don't know"; lines.push(`Q${i+1}${item.critical?" [Critical]":""}: ${item.q}`,`  Answer: ${label}`); if(notes[i])lines.push(`  Note: ${notes[i]}`); lines.push(""); });
    const st2=STEPS[scenario][sc.level]; lines.push("---","Next steps:"); st2.forEach((st,i)=>lines.push(`${i+1}. ${st}`));
    lines.push("","General guidance only — not legal advice.");
    try {
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, { to_email:hrEmailAddr, subject:`[HR Action Check] ${scenario} — ${ll2}${employeeName.trim()?" ("+employeeName.trim()+")":""}`, message:lines.join("\n"), name:"HR Action Check", email:hrEmailAddr });
      // Save to HR inbox in localStorage
      const entry = { id:Date.now(), scenario, answers, notes, level:sc.level, date:new Date().toLocaleDateString(), time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}), managerName:employeeName.trim(), status:"open" };
      const inbox = loadHRInbox();
      saveHRInbox([entry,...inbox].slice(0,50));
      setHrEmailStatus("sent");
    } catch(e) { setHrEmailStatus("error"); }
  };

  const saveFollowUp = () => {
    if (!followUpEmail.includes("@") || !sc) return;
    const followUps = loadFollowUps();
    const followUpDate = new Date(); followUpDate.setDate(followUpDate.getDate()+30);
    const entry = { id:Date.now(), scenario, level:sc.level, email:followUpEmail, dueDate:followUpDate.toLocaleDateString(), managerName:employeeName.trim() };
    saveFollowUps([entry,...followUps].slice(0,20));
    setFollowUpSet(true);
  };
  const pick  = (name) => { setScenario(name); setStep("context"); setAnswers([]); setNotes([]); setHints([]); setShowDocTips(false); setShowResume(false); };
  const start = () => { const n=QS[scenario].length; setAnswers(new Array(n).fill(null)); setNotes(new Array(n).fill("")); setHints(new Array(n).fill(false)); setStep("questions"); setEmailStatus("idle"); setHrEmailStatus("idle"); setShowFollowUp(false); setFollowUpSet(false); };
  const ans   = (idx,val) => {
    const next=[...answers]; next[idx]=val; setAnswers(next);
    if(next.every(a=>a!==null)){
      const{level}=computeScore(qs,next);
      setHistory(h=>[{scenario,level,time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})},...h]);
      const entry={ id:Date.now(), scenario, answers:next, notes, level, date:new Date().toLocaleDateString(), time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}), employeeName:employeeName.trim() };
      setCheckHistory(h=>{ const updated=[entry,...h].slice(0,10); saveCheckHistory(updated); return updated; });
      setStep("result");
    }
  };
  const startNew = () => { clearSession(); setScenario(null); setStep("pick"); setAnswers([]); setNotes([]); setHints([]); setEmailAddr(""); setEmailStatus("idle"); setHrEmailStatus("idle"); setEmployeeName(""); setShowFollowUp(false); setFollowUpSet(false); };

  const ll = liveLevel();
  const liveColors = {neutral:"#8899aa",good:"#34d399",warn:"#fbbf24",risk:"#fb7185"};
  const liveBg     = {neutral:"rgba(255,255,255,0.04)",good:"rgba(52,211,153,0.08)",warn:"rgba(251,191,36,0.08)",risk:"rgba(251,113,133,0.08)"};
  const liveBorder = {neutral:"rgba(255,255,255,0.07)",good:"rgba(52,211,153,0.25)",warn:"rgba(251,191,36,0.25)",risk:"rgba(251,113,133,0.25)"};
  const liveMsgs   = {neutral:"Answer each question to see your risk level update.",good:"Tracking as routine so far.",warn:"Some risk indicators present — finish all questions.",risk:"High-risk signals detected. Review carefully."};

  const s = {
    wrap:  { fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif", background:"linear-gradient(160deg,#020617 0%,#050d1f 50%,#020617 100%)", minHeight:"100vh", color:"#f8fafc", padding:"18px 16px 50px" },
    card:  { background:"rgba(255,255,255,0.025)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:16, padding:"18px 20px", marginBottom:20 },
    label: { fontSize:"0.7rem", letterSpacing:"0.08em", textTransform:"uppercase", color:"#8899aa", marginBottom:10, display:"block" },
    grid:  { display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))", gap:10, marginBottom:22 },
    scard: (active) => ({ background:active?"linear-gradient(135deg,rgba(34,193,255,0.12),rgba(110,231,183,0.07))":"rgba(255,255,255,0.04)", border:`1px solid ${active?"rgba(34,193,255,0.6)":"rgba(255,255,255,0.07)"}`, borderRadius:12, padding:"13px 12px", cursor:"pointer", display:"flex", flexDirection:"column", gap:6, transition:"all .15s" }),
    badge: (level) => ({ fontSize:"0.62rem", fontWeight:700, letterSpacing:"0.05em", padding:"2px 7px", borderRadius:5, width:"fit-content", textTransform:"uppercase", background:level==="high"?"rgba(251,113,133,0.15)":"rgba(251,191,36,0.12)", color:level==="high"?"#fb7185":"#fbbf24", border:`1px solid ${level==="high"?"rgba(251,113,133,0.25)":"rgba(251,191,36,0.25)"}` }),
    btn:   (primary) => ({ padding:primary?"10px 20px":"8px 16px", borderRadius:999, border:primary?"1px solid rgba(34,193,255,0.45)":"1px solid rgba(255,255,255,0.1)", background:primary?"rgba(34,193,255,0.12)":"rgba(255,255,255,0.04)", color:primary?"#22c1ff":"#f8fafc", cursor:"pointer", fontSize:"0.82rem", fontWeight:600, fontFamily:"inherit" }),
  };

  const copySum = () => {
    if (!sc) return;
    const ll2=sc.level==="good"?"Low Risk":sc.level==="warn"?"Elevated Risk":"High Risk";
    const lines=[`HR Action Check`,`Scenario: ${scenario}`,`Result: ${ll2}`,`Date: ${new Date().toLocaleDateString()}`,""];
    qs.forEach((item,i)=>{ const a=answers[i]; const label=a==="yes"?"Yes":a==="no"?"No":"Don't know"; lines.push(`Q${i+1}${item.critical?" [Critical]":""}: ${item.q}`,`  Answer: ${label}`); if(notes[i])lines.push(`  Note: ${notes[i]}`); lines.push(""); });
    const st2=STEPS[scenario][sc.level]; lines.push("---","Next steps:"); st2.forEach((st,i)=>lines.push(`${i+1}. ${st}`));
    const rel=policies.filter(p=>{ const cat=POLICY_CATEGORIES.find(c=>c.id===p.category); return cat&&(cat.scenarios.includes(scenario)||cat.id==="handbook"); });
    if(rel.length){ lines.push("","--- Company documents referenced:"); rel.forEach(p=>lines.push(`- ${p.name} (${POLICY_CATEGORIES.find(c=>c.id===p.category)?.label})`)); }
    lines.push("","General guidance only — not legal advice.");
    navigator.clipboard.writeText(lines.join("\n")).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); });
  };

  return (
    <div style={s.wrap}>
      {showPolicyLib && <PolicyLibrary policies={policies} setPolicies={setPolicies} onClose={()=>setShowPolicyLib(false)} currentScenario={scenario} />}

      <div style={{ maxWidth:840, margin:"0 auto" }}>

        {/* Header */}
        <div style={{ ...s.card }}>
          <div className="hdr-row" style={{ display:"flex", alignItems:"center", gap:14 }}>
            <div style={{ width:46, height:46, flexShrink:0, borderRadius:12, background:"linear-gradient(135deg,#22c1ff,#6ee7b7)", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, fontSize:15, color:"#02111a" }}>HR✓</div>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:"1.25rem", fontWeight:700 }}>HR Action Check</div>
              <div className="hdr-desc" style={{ fontSize:"0.83rem", color:"#8899aa", marginTop:3 }}>A private confidence check for people-management decisions. Completed checks save to this browser — email yourself to keep a permanent record.</div>
            </div>
            <button className="hdr-pol" onClick={()=>setShowPolicyLib(true)} style={{ ...s.btn(false), flexShrink:0, display:"flex", alignItems:"center", gap:7, whiteSpace:"nowrap", ...(policies.length>0?{borderColor:"rgba(34,193,255,0.3)",color:"#22c1ff",background:"rgba(34,193,255,0.07)"}:{}) }}>
              <span>📁</span>
              <span>Company Policies{policies.length>0?` (${policies.length})`:""}</span>
            </button>
          </div>
        </div>

        {/* Resume banner */}
        {showResumeBanner && savedSession && (
          <div style={{ background:"rgba(34,193,255,0.07)", border:"1px solid rgba(34,193,255,0.25)", borderRadius:12, padding:"14px 18px", marginBottom:18, display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, flexWrap:"wrap" }}>
            <div>
              <div style={{ fontSize:"0.85rem", fontWeight:700, color:"#22c1ff", marginBottom:3 }}>You have a saved session</div>
              <div style={{ fontSize:"0.79rem", color:"#8899aa" }}>{META[savedSession.scenario].icon} {savedSession.scenario} — {savedSession.step==="result"?"completed":"in progress"}</div>
            </div>
            <div style={{ display:"flex", gap:8, flexShrink:0 }}>
              <button style={s.btn(true)} onClick={resumeSession}>Resume</button>
              <button style={s.btn(false)} onClick={dismissResume}>Dismiss</button>
            </div>
          </div>
        )}

        {/* 30-day follow-up reminders */}
        {step==="pick" && (() => {
          const followUps = loadFollowUps();
          const today = new Date(); today.setHours(0,0,0,0);
          const due = followUps.filter(f => { try { const d=new Date(f.dueDate); d.setHours(0,0,0,0); return d<=today; } catch(e){ return false; } });
          if (due.length===0) return null;
          return (
            <div style={{ background:"rgba(251,191,36,0.07)", border:"1px solid rgba(251,191,36,0.3)", borderRadius:12, padding:"14px 18px", marginBottom:18 }}>
              <div style={{ fontSize:"0.85rem", fontWeight:700, color:"#fbbf24", marginBottom:6 }}>30-day check-in due</div>
              {due.map(f=>(
                <div key={f.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, marginBottom:6, flexWrap:"wrap" }}>
                  <div style={{ fontSize:"0.79rem", color:"rgba(248,250,252,0.7)" }}>
                    {META[f.scenario]?.icon} {f.scenario}{f.managerName?` — ${f.managerName}`:""}
                    <span style={{ marginLeft:8, fontSize:"0.72rem", color:"#8899aa" }}>Due {f.dueDate}</span>
                  </div>
                  <div style={{ display:"flex", gap:7, flexShrink:0 }}>
                    <button style={{ ...s.btn(true), fontSize:"0.74rem", padding:"5px 12px" }} onClick={()=>pick(f.scenario)}>Run check</button>
                    <button style={{ ...s.btn(false), fontSize:"0.74rem", padding:"5px 12px" }} onClick={()=>{ const updated=loadFollowUps().filter(x=>x.id!==f.id); saveFollowUps(updated); }}>Dismiss</button>
                  </div>
                </div>
              ))}
            </div>
          );
        })()}

        {/* Scenario grid */}
        <span style={s.label}>Step 1 — select your situation</span>
        <div style={s.grid}>
          {Object.keys(META).map(name=>{
            const mm=META[name];
            return (
              <div key={name} style={s.scard(scenario===name)} onClick={()=>pick(name)}>
                <div style={{ fontSize:"1.3rem" }}>{mm.icon}</div>
                <div style={{ fontSize:"0.85rem", fontWeight:600, lineHeight:1.25 }}>{name}</div>
                <div style={s.badge(mm.riskLevel)}>{mm.riskLabel}</div>
              </div>
            );
          })}
        </div>


        {/* Session History Box */}
        {step==="pick" && (
          <div style={{ marginBottom:18 }}>
            <div onClick={()=>{ setShowHistory(v=>!v); setViewingPast(null); }} style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:12, padding:"14px 18px", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, userSelect:"none" }}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:"1.1rem" }}>🗂️</span>
                <div>
                  <div style={{ fontWeight:700, fontSize:"0.9rem" }}>Session History</div>
                  <div style={{ fontSize:"0.76rem", color:"#8899aa", marginTop:1 }}>{checkHistory.length===0?"No past checks yet":`${checkHistory.length} saved check${checkHistory.length!==1?"s":""} — tap to view or delete`}</div>
                </div>
              </div>
              <span style={{ color:"#8899aa", fontSize:"0.85rem", flexShrink:0 }}>{showHistory?"▲":"▼"}</span>
            </div>

            {showHistory && (
              <div style={{ background:"rgba(255,255,255,0.02)", border:"1px solid rgba(255,255,255,0.07)", borderTop:"none", borderRadius:"0 0 12px 12px", padding:"14px 16px" }}>
                {checkHistory.length===0 ? (
                  <div style={{ textAlign:"center", padding:"16px 0", color:"#8899aa", fontSize:"0.83rem" }}>No past checks saved yet. Complete a check to see it here.</div>
                ) : (
                  <div>
                    <div style={{ display:"flex", justifyContent:"flex-end", marginBottom:10 }}>
                      <button style={{ fontSize:"0.72rem", color:"#fb7185", background:"none", border:"none", cursor:"pointer", fontFamily:"inherit", padding:0 }} onClick={()=>{ saveCheckHistory([]); setCheckHistory([]); setViewingPast(null); }}>Clear all</button>
                    </div>
                    {viewingPast!==null && checkHistory[viewingPast] ? (()=>{
              const e=checkHistory[viewingPast];
              const eqs=QS[e.scenario]; const col=C[e.level];
              const st2=STEPS[e.scenario][e.level];
              const labels={good:"Low Risk",warn:"Elevated Risk",risk:"High Risk"};
              return (
                <div style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.09)", borderRadius:14, padding:"16px 18px", marginBottom:8 }}>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
                    <div>
                      <div style={{ fontWeight:700, fontSize:"0.95rem" }}>{META[e.scenario].icon} {e.scenario}</div>
                      {e.employeeName && <div style={{ fontSize:"0.8rem", color:"#22c1ff", fontWeight:600, marginTop:2 }}>{e.employeeName}</div>}
                      <div style={{ fontSize:"0.74rem", color:"#8899aa", marginTop:2 }}>{e.date} at {e.time}</div>
                    </div>
                    <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                      <span style={{ fontSize:"0.65rem", fontWeight:700, textTransform:"uppercase", padding:"3px 8px", borderRadius:5, background:col.bg, color:col.text, border:`1px solid ${col.border}` }}>{labels[e.level]}</span>
                      <button style={s.btn(false)} onClick={()=>setViewingPast(null)}>Close</button>
                    </div>
                  </div>
                  {eqs.map((item,i)=>{ const a=e.answers[i]; const aLabel=a==="yes"?"Yes":a==="no"?"No":"Don't know"; const aColor=a==="yes"?"#34d399":a==="no"?"#fb7185":"#fbbf24";
                    return (
                      <div key={i} style={{ borderTop:"1px solid rgba(255,255,255,0.06)", paddingTop:9, marginTop:9 }}>
                        <div style={{ fontSize:"0.82rem", lineHeight:1.45, color:"rgba(248,250,252,0.8)", marginBottom:4 }}>{item.q}</div>
                        <div style={{ fontSize:"0.78rem", fontWeight:700, color:aColor }}>{aLabel}</div>
                        {e.notes[i] && <div style={{ fontSize:"0.76rem", color:"#8899aa", marginTop:3, fontStyle:"italic" }}>{e.notes[i]}</div>}
                      </div>
                    );
                  })}
                  <div style={{ marginTop:14, borderTop:"1px solid rgba(255,255,255,0.06)", paddingTop:12 }}>
                    <div style={{ fontSize:"0.68rem", letterSpacing:"0.07em", textTransform:"uppercase", color:"#8899aa", marginBottom:8 }}>Next steps from that check</div>
                    {st2.map((st,i)=>(
                      <div key={i} style={{ display:"flex", gap:8, fontSize:"0.81rem", lineHeight:1.5, color:"rgba(248,250,252,0.7)", marginBottom:5 }}>
                        <span style={{ color:col.text, fontWeight:700, flexShrink:0 }}>{i+1}.</span><span>{st}</span>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })() : (
              checkHistory.map((e,i)=>{ const col=C[e.level]; const labels={good:"Low Risk",warn:"Elevated Risk",risk:"High Risk"};
                return (
                  <div key={e.id} onClick={()=>setViewingPast(i)} style={{ background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:10, padding:"11px 14px", marginBottom:7, display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, cursor:"pointer" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                      <div style={{ width:7, height:7, borderRadius:"50%", background:col.text, flexShrink:0 }} />
                      <div>
                        <div style={{ fontWeight:600, fontSize:"0.85rem" }}>{META[e.scenario].icon} {e.scenario}</div>
                        <div style={{ fontSize:"0.72rem", color:"#8899aa", marginTop:1 }}>{e.employeeName ? <span style={{ color:"rgba(248,250,252,0.6)", marginRight:6 }}>{e.employeeName} ·</span> : null}{e.date} · {e.time}</div>
                      </div>
                    </div>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <span style={{ fontSize:"0.65rem", fontWeight:700, textTransform:"uppercase", padding:"2px 7px", borderRadius:4, background:col.bg, color:col.text, border:`1px solid ${col.border}`, whiteSpace:"nowrap" }}>{labels[e.level]}</span>
                      <span style={{ fontSize:"0.72rem", color:"#8899aa" }}>View →</span>
                      <button onClick={ev=>{ ev.stopPropagation(); const updated=checkHistory.filter((_,idx)=>idx!==i); setCheckHistory(updated); saveCheckHistory(updated); }} style={{ background:"none", border:"none", cursor:"pointer", color:"#fb7185", fontSize:"0.85rem", padding:"2px 4px", lineHeight:1, fontFamily:"inherit" }} title="Delete">×</button>
                    </div>
                  </div>
                );
              })
            )}
                  </div>
                )}
              </div>
            )}
          </div>
        )}

        {/* Email nudge on pick screen */}
        {step==="pick" && (
          <div style={{ background:"rgba(34,193,255,0.05)", border:"1px solid rgba(34,193,255,0.18)", borderRadius:12, padding:"13px 18px", marginBottom:18, display:"flex", alignItems:"center", gap:12 }}>
            <span style={{ fontSize:"1.2rem", flexShrink:0 }}>📧</span>
            <div style={{ fontSize:"0.83rem", color:"rgba(248,250,252,0.75)", lineHeight:1.5 }}>
              When you finish your check, you can <strong style={{ color:"#22c1ff" }}>email the full results to yourself</strong> — add your own notes and bring it to HR.
            </div>
          </div>
        )}

        {/* Context panel */}
        {step!=="pick" && m && (
          <div style={{ ...s.card, marginBottom:18 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:10 }}>
              <div style={{ fontSize:"1rem", fontWeight:700 }}>{m.icon} {scenario}</div>
              <div style={s.badge(m.riskLevel)}>{m.riskLabel}</div>
            </div>
            <div style={{ fontSize:"0.88rem", color:"rgba(248,250,252,0.78)", lineHeight:1.6, marginBottom:14 }}>{m.description}</div>
            <div style={{ fontSize:"0.68rem", letterSpacing:"0.07em", textTransform:"uppercase", color:"#8899aa", marginBottom:9 }}>Common examples</div>
            {m.examples.map((ex,i)=>(
              <div key={i} style={{ display:"flex", gap:9, background:"rgba(255,255,255,0.03)", border:"1px solid rgba(255,255,255,0.05)", borderRadius:9, padding:"9px 12px", fontSize:"0.82rem", lineHeight:1.5, color:"rgba(248,250,252,0.7)", marginBottom:6 }}>
                <span style={{ color:"#8899aa", flexShrink:0 }}>→</span><span>{ex}</span>
              </div>
            ))}
            <div style={{ marginTop:14, marginBottom:4 }}>
              <button style={{ fontSize:"0.71rem", color:"rgba(34,193,255,0.75)", cursor:"pointer", background:"none", border:"none", fontFamily:"inherit", padding:0, fontWeight:600, letterSpacing:"0.04em", textTransform:"uppercase" }} onClick={()=>setShowDocTips(v=>!v)}>
                {showDocTips?"Hide documentation tips":"+ How to document this situation"}
              </button>
            </div>
            {showDocTips && (
              <div style={{ background:"rgba(34,193,255,0.05)", border:"1px solid rgba(34,193,255,0.15)", borderRadius:9, padding:"12px 14px", marginBottom:10 }}>
                <div style={{ fontSize:"0.68rem", letterSpacing:"0.07em", textTransform:"uppercase", color:"rgba(34,193,255,0.7)", marginBottom:8, fontWeight:700 }}>Documentation guidance</div>
                {m.docTips.map((tip,i)=>(
                  <div key={i} style={{ display:"flex", gap:9, fontSize:"0.81rem", lineHeight:1.5, color:"rgba(248,250,252,0.75)", marginBottom:6 }}>
                    <span style={{ color:"rgba(34,193,255,0.5)", flexShrink:0, fontWeight:700 }}>{i+1}.</span><span>{tip}</span>
                  </div>
                ))}
              </div>
            )}
            <div style={{ background:"rgba(251,191,36,0.07)", border:"1px solid rgba(251,191,36,0.2)", borderRadius:9, padding:"10px 13px", fontSize:"0.82rem", color:"rgba(251,191,36,0.9)", lineHeight:1.5, margin:"10px 0 10px" }}>
              <strong>Watch for:</strong> {m.watch}
            </div>
            <div style={{ background:"rgba(110,231,183,0.06)", border:"1px solid rgba(110,231,183,0.2)", borderRadius:9, padding:"10px 13px", fontSize:"0.82rem", color:"rgba(110,231,183,0.9)", lineHeight:1.5, marginBottom:16 }}>
              <strong>Not sure? Contact HR:</strong> {m.contactHR}
            </div>
            {step==="context" && (
              <div style={{ marginBottom:14 }}>
                <div style={{ fontSize:"0.7rem", color:"#8899aa", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:6, fontWeight:600 }}>Employee name <span style={{ color:"#667788", fontWeight:400, textTransform:"none", letterSpacing:0 }}>(optional)</span></div>
                <input type="text" placeholder="e.g. Alex Johnson" value={employeeName} onChange={e=>setEmployeeName(e.target.value)} style={{ width:"100%", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:9, padding:"10px 13px", color:"#f8fafc", fontSize:"0.88rem", fontFamily:"inherit", outline:"none" }} />
                <div style={{ fontSize:"0.73rem", color:"#667788", marginTop:5 }}>If added, this name will appear in Session History so you can identify this check later.</div>
              </div>
            )}
            {step==="context" ? <button style={s.btn(true)} onClick={start}>Start the check</button> : <button style={s.btn(false)} onClick={()=>setStep("context")}>Back to overview</button>}
          </div>
        )}

        {/* Questions */}
        {(step==="questions"||step==="result") && (
          <div style={{ marginBottom:18 }}>
            <span style={s.label}>Step 2 — {scenario} check</span>
            <div style={{ marginBottom:14 }}>
              <div style={{ height:3, background:"rgba(255,255,255,0.07)", borderRadius:99, marginBottom:5 }}>
                <div style={{ height:"100%", borderRadius:99, background:"linear-gradient(90deg,#22c1ff,#6ee7b7)", width:`${qs.length?(answered/qs.length)*100:0}%`, transition:"width .3s" }} />
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:"0.74rem", color:"#8899aa" }}>
                <span>{answered} of {qs.length} answered</span><span>{qs.length?Math.round((answered/qs.length)*100):0}%</span>
              </div>
            </div>
            <PolicyHint policies={policies} scenario={scenario} />
            <div style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 13px", borderRadius:9, fontSize:"0.82rem", fontWeight:600, marginBottom:16, border:`1px solid ${liveBorder[ll]}`, background:liveBg[ll], color:liveColors[ll], transition:"all .25s" }}>
              <div style={{ width:7, height:7, borderRadius:"50%", background:"currentColor", flexShrink:0 }} />
              {liveMsgs[ll]}
            </div>
            {qs.map((item,idx)=>{
              const a=answers[idx];
              const rowBg=a==="yes"?"rgba(52,211,153,0.06)":a==="no"?"rgba(251,113,133,0.06)":a==="unknown"?"rgba(251,191,36,0.05)":"rgba(255,255,255,0.04)";
              const rowBorder=a==="yes"?"rgba(52,211,153,0.28)":a==="no"?"rgba(251,113,133,0.28)":a==="unknown"?"rgba(251,191,36,0.22)":"rgba(255,255,255,0.07)";
              return (
                <div key={idx} style={{ background:rowBg, border:`1px solid ${rowBorder}`, borderRadius:11, padding:"13px 15px", marginBottom:9, transition:"all .2s" }}>
                  <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", gap:12 }}>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:"0.68rem", color:"#8899aa", fontWeight:600, marginBottom:3, textTransform:"uppercase", letterSpacing:"0.04em" }}>Question {idx+1} of {qs.length}</div>
                      <div style={{ fontSize:"0.88rem", lineHeight:1.5, display:"flex", alignItems:"center", flexWrap:"wrap", gap:6 }}>
                        {item.q}
                        {item.critical && <span style={{ fontSize:"0.62rem", fontWeight:700, letterSpacing:"0.05em", textTransform:"uppercase", background:"rgba(251,113,133,0.12)", border:"1px solid rgba(251,113,133,0.3)", color:"#fb7185", borderRadius:5, padding:"2px 6px", whiteSpace:"nowrap" }}>Critical</span>}
                      </div>
                      <button style={{ fontSize:"0.71rem", color:"rgba(34,193,255,0.65)", cursor:"pointer", marginTop:5, background:"none", border:"none", fontFamily:"inherit", padding:0 }} onClick={()=>{const h=[...hints];h[idx]=!h[idx];setHints(h);}}>
                        {hints[idx]?"Hide":"+ Why this matters"}
                      </button>
                      {hints[idx] && <div style={{ fontSize:"0.77rem", color:"#8899aa", marginTop:5, lineHeight:1.45 }}>{item.hint}</div>}
                    </div>
                    <div style={{ display:"flex", gap:5, flexShrink:0 }}>
                      {[["Yes","yes"],["No","no"],["?","unknown"]].map(([label,val])=>{
                        const on=a===val;
                        const onBg=val==="yes"?"rgba(52,211,153,0.2)":val==="no"?"rgba(251,113,133,0.2)":"rgba(251,191,36,0.15)";
                        const onBorder=val==="yes"?"rgba(52,211,153,0.55)":val==="no"?"rgba(251,113,133,0.55)":"rgba(251,191,36,0.45)";
                        const onColor=val==="yes"?"#34d399":val==="no"?"#fb7185":"#fbbf24";
                        return <button key={val} className="ans-btn" title={val==="unknown"?"Don't know":undefined} style={{ padding:"5px 12px", borderRadius:999, border:`1px solid ${on?onBorder:"rgba(255,255,255,0.1)"}`, background:on?onBg:"transparent", color:on?onColor:"#f8fafc", cursor:"pointer", fontWeight:600, fontSize:"0.77rem", minWidth:46, fontFamily:"inherit" }} onClick={()=>ans(idx,val)}>{label}</button>;
                      })}
                    </div>
                  </div>
                  {a!==null && <textarea rows={2} className="notes-ta" placeholder="Add context or notes (optional)..." style={{ width:"100%", marginTop:9, background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.08)", borderRadius:7, padding:"7px 10px", color:"#f8fafc", fontSize:"0.79rem", fontFamily:"inherit", resize:"none", outline:"none" }} value={notes[idx]||""} onChange={e=>{const n=[...notes];n[idx]=e.target.value;setNotes(n);}} />}
                </div>
              );
            })}
          </div>
        )}

        {/* Result */}
        {step==="result" && sc && (()=>{
          const col=C[sc.level];
          const st2=STEPS[scenario][sc.level];
          const titles={good:"Routine management action — proceed carefully.",warn:"Elevated risk — pause and address gaps before acting.",risk:"High risk — do not proceed without HR or legal review."};
          const summaries={good:"Your answers indicate this situation is within standard management scope. Document each step you take.",warn:"One or more answers reveal gaps in process, documentation, or legal review. Resolve these before taking action.",risk:"Critical risk factors are present. Acting without HR or legal involvement exposes you and the organization significantly."};
          const labels={good:"Low Risk",warn:"Elevated Risk",risk:"High Risk"};
          const dn=qs.length-sc.yes-sc.no;
          const rel=policies.filter(p=>{ const cat=POLICY_CATEGORIES.find(c=>c.id===p.category); return cat&&(cat.scenarios.includes(scenario)||cat.id==="handbook"); });
          return (
            <div>
              <div style={{ background:"rgba(34,193,255,0.06)", border:"1px solid rgba(34,193,255,0.2)", borderRadius:11, padding:"12px 16px", marginBottom:14, display:"flex", alignItems:"center", gap:11 }}>
                <span style={{ fontSize:"1.1rem", flexShrink:0 }}>📧</span>
                <div style={{ fontSize:"0.83rem", color:"rgba(248,250,252,0.8)", lineHeight:1.5 }}>When you're done reviewing, <strong style={{ color:"#22c1ff" }}>enter your email at the bottom of this page</strong> to send yourself a copy — add your own notes or context directly in the email before bringing it to HR.</div>
              </div>
              <span style={s.label}>Assessment</span>
              {sc.crit && <div style={{ background:"rgba(251,113,133,0.08)", border:"1px solid rgba(251,113,133,0.35)", borderRadius:11, padding:"12px 14px", fontSize:"0.84rem", color:"rgba(253,205,211,0.9)", lineHeight:1.55, marginBottom:11 }}><strong>Critical question not confirmed.</strong> One or more questions marked Critical were answered No or Don't Know. These carry significant legal exposure. HR and legal review is required before any action.</div>}
              {sc.unk>0 && <div style={{ background:"rgba(251,191,36,0.06)", border:"1px solid rgba(251,191,36,0.2)", borderRadius:10, padding:"10px 13px", fontSize:"0.82rem", color:"rgba(253,230,138,0.85)", lineHeight:1.5, marginBottom:11 }}>{sc.unk} question{sc.unk>1?"s were":" was"} answered "Don't know." Uncertainty is a risk signal and has been factored into the score.</div>}
              <div style={{ background:col.bg, border:`1px solid ${col.border}`, borderRadius:14, padding:"18px 20px", marginBottom:12 }}>
                <div style={{ fontSize:"0.68rem", letterSpacing:"0.09em", textTransform:"uppercase", fontWeight:700, color:col.text, marginBottom:4, opacity:0.85 }}>{labels[sc.level]}</div>
                <div style={{ fontSize:"1rem", fontWeight:700, color:col.light, marginBottom:6 }}>{titles[sc.level]}</div>
                <div style={{ fontSize:"0.86rem", lineHeight:1.6, opacity:0.84, marginBottom:14 }}>{summaries[sc.level]}</div>
                <div style={{ fontSize:"0.68rem", letterSpacing:"0.07em", textTransform:"uppercase", color:"#8899aa", marginBottom:9 }}>Recommended next steps</div>
                {st2.map((st,i)=>(
                  <div key={i} style={{ display:"flex", alignItems:"flex-start", gap:9, fontSize:"0.84rem", lineHeight:1.5, padding:"8px 11px", background:"rgba(255,255,255,0.04)", borderRadius:8, border:"1px solid rgba(255,255,255,0.06)", marginBottom:6 }}>
                    <span style={{ fontSize:"0.68rem", fontWeight:700, width:18, height:18, borderRadius:"50%", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0, marginTop:1, background:`${col.text}22`, color:col.text }}>{i+1}</span>
                    <span>{st}</span>
                  </div>
                ))}
              </div>
              {rel.length>0 && (
                <div style={{ background:"rgba(34,193,255,0.05)", border:"1px solid rgba(34,193,255,0.18)", borderRadius:11, padding:"13px 16px", marginBottom:12 }}>
                  <div style={{ fontSize:"0.7rem", letterSpacing:"0.07em", textTransform:"uppercase", color:"rgba(34,193,255,0.7)", marginBottom:9, fontWeight:700 }}>Company documents on file for this scenario</div>
                  {rel.map(doc=>{ const cat=POLICY_CATEGORIES.find(c=>c.id===doc.category); return (
                    <div key={doc.id} style={{ display:"flex", alignItems:"center", gap:10, background:"rgba(255,255,255,0.03)", borderRadius:8, padding:"8px 11px", marginBottom:6 }}>
                      <span style={{ fontSize:"0.9rem" }}>📄</span>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize:"0.82rem", fontWeight:700 }}>{doc.name}</div>
                        <div style={{ fontSize:"0.71rem", color:"#8899aa" }}>{cat?.label} · {(doc.chars/1000).toFixed(1)}k chars</div>
                      </div>
                      <button style={{ ...s.btn(false), padding:"4px 10px", fontSize:"0.73rem" }} onClick={()=>setShowPolicyLib(true)}>View</button>
                    </div>
                  );})}
                </div>
              )}
              <div style={{ background:"rgba(110,231,183,0.06)", border:"1px solid rgba(110,231,183,0.2)", borderRadius:10, padding:"10px 14px", fontSize:"0.82rem", color:"rgba(110,231,183,0.9)", lineHeight:1.55, marginBottom:12 }}>
                <strong>Still not sure?</strong> {META[scenario].contactHR}
              </div>
              <div style={{ background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:11, padding:"14px 16px", marginBottom:12 }}>
                <div style={{ fontSize:"0.68rem", letterSpacing:"0.07em", textTransform:"uppercase", color:"#8899aa", marginBottom:10 }}>Answer breakdown</div>
                {[["Yes",sc.yes,"#34d399"],["No",sc.no,"#fb7185"],["Don't know",dn,"#fbbf24"]].map(([label,count,color])=>(
                  <div key={label} style={{ display:"flex", alignItems:"center", gap:10, marginBottom:7 }}>
                    <div style={{ fontSize:"0.78rem", width:90, flexShrink:0, color:"rgba(248,250,252,0.7)" }}>{label}</div>
                    <div style={{ flex:1, height:5, background:"rgba(255,255,255,0.07)", borderRadius:99, overflow:"hidden" }}>
                      <div style={{ height:"100%", background:color, borderRadius:99, width:`${qs.length?(count/qs.length)*100:0}%`, transition:"width .4s" }} />
                    </div>
                    <div style={{ fontSize:"0.77rem", color:"#8899aa", width:20, textAlign:"right" }}>{count}</div>
                  </div>
                ))}
              </div>
              <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                <button style={s.btn(true)} onClick={start}>Run again</button>
                <button style={s.btn(false)} onClick={startNew}>New situation</button>
                <button style={s.btn(false)} onClick={copySum}>{copied?"Copied!":"Copy summary"}</button>
              </div>
              <div style={{ marginTop:16, background:"linear-gradient(135deg,rgba(34,193,255,0.07),rgba(110,231,183,0.05))", border:"1px solid rgba(34,193,255,0.3)", borderRadius:14, padding:"20px 18px" }}>
                <div style={{ fontSize:"1rem", fontWeight:700, color:"#f8fafc", marginBottom:6 }}>Email this to yourself</div>
                <div style={{ fontSize:"0.83rem", color:"rgba(248,250,252,0.65)", lineHeight:1.55, marginBottom:14 }}>We'll send your full results to your inbox. Open the email, add your own notes or context, and bring it to HR — the document is yours to edit.</div>
                {emailStatus==="sent" ? (
                  <div>
                    <div style={{ background:"rgba(52,211,153,0.1)", border:"1px solid rgba(52,211,153,0.35)", borderRadius:10, padding:"14px 16px", color:"#34d399", fontSize:"0.9rem", fontWeight:600, textAlign:"center", marginBottom:12 }}>
                      ✓ Sent to your inbox! Add your notes and forward to HR.
                    </div>
                    <button style={{ ...s.btn(true), width:"100%", justifyContent:"center", display:"flex" }} onClick={startNew}>Start a new check</button>
                  </div>
                ) : (
                  <div>
                    <div style={{ fontSize:"0.72rem", color:"#22c1ff", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:7 }}>Enter your email address</div>
                    <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                      <input type="email" className="email-input" placeholder="your@email.com" value={emailAddr} onChange={e=>{ setEmailAddr(e.target.value); setEmailStatus("idle"); }} style={{ flex:1, minWidth:180, background:"rgba(255,255,255,0.08)", border:"1px solid rgba(34,193,255,0.3)", borderRadius:9, padding:"11px 14px", color:"#f8fafc", fontSize:"0.9rem", fontFamily:"inherit", outline:"none" }} />
                      <button style={{ ...s.btn(true), padding:"11px 20px", opacity:emailStatus==="sending"?0.6:1 }} onClick={sendEmail} disabled={emailStatus==="sending"||!emailAddr.includes("@")}>
                        {emailStatus==="sending"?"Sending...":"Send to my email"}
                      </button>
                    </div>
                  </div>
                )}
                {emailStatus==="error" && <div style={{ fontSize:"0.78rem", color:"#fb7185", marginTop:8 }}>Something went wrong. Try again or use Copy Summary above.</div>}
              </div>

              {/* Send to HR */}
              <div style={{ marginTop:12, background:"linear-gradient(135deg,rgba(110,231,183,0.07),rgba(34,193,255,0.04))", border:"1px solid rgba(110,231,183,0.3)", borderRadius:14, padding:"20px 18px" }}>
                <div style={{ fontSize:"1rem", fontWeight:700, color:"#f8fafc", marginBottom:6 }}>Send to HR</div>
                <div style={{ fontSize:"0.83rem", color:"rgba(248,250,252,0.65)", lineHeight:1.55, marginBottom:14 }}>Send your full results directly to your HR contact. HR will receive a copy and can track it in their dashboard.</div>
                {hrEmailStatus==="sent" ? (
                  <div style={{ background:"rgba(52,211,153,0.1)", border:"1px solid rgba(52,211,153,0.35)", borderRadius:10, padding:"14px 16px", color:"#34d399", fontSize:"0.9rem", fontWeight:600, textAlign:"center" }}>
                    ✓ Sent to HR. They have your results and will follow up.
                  </div>
                ) : (
                  <div>
                    <div style={{ fontSize:"0.72rem", color:"#6ee7b7", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:7 }}>HR email address</div>
                    <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                      <input type="email" className="email-input" placeholder="hr@yourcompany.com" value={hrEmailAddr} onChange={e=>{ setHrEmailAddr(e.target.value); setHrEmailStatus("idle"); }} style={{ flex:1, minWidth:180, background:"rgba(255,255,255,0.08)", border:"1px solid rgba(110,231,183,0.3)", borderRadius:9, padding:"11px 14px", color:"#f8fafc", fontSize:"0.9rem", fontFamily:"inherit", outline:"none" }} />
                      <button style={{ ...s.btn(false), padding:"11px 20px", borderColor:"rgba(110,231,183,0.45)", color:"#6ee7b7", background:"rgba(110,231,183,0.1)", opacity:hrEmailStatus==="sending"?0.6:1 }} onClick={sendToHR} disabled={hrEmailStatus==="sending"||!hrEmailAddr.includes("@")}>
                        {hrEmailStatus==="sending"?"Sending...":"Send to HR"}
                      </button>
                    </div>
                  </div>
                )}
                {hrEmailStatus==="error" && <div style={{ fontSize:"0.78rem", color:"#fb7185", marginTop:8 }}>Something went wrong. Try again or use Copy Summary above.</div>}
              </div>

              {/* 30-day follow-up */}
              <div style={{ marginTop:12, background:"rgba(251,191,36,0.05)", border:"1px solid rgba(251,191,36,0.25)", borderRadius:14, padding:"16px 18px" }}>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:12 }}>
                  <div>
                    <div style={{ fontSize:"0.88rem", fontWeight:700, color:"#f8fafc", marginBottom:3 }}>Check back in 30 days</div>
                    <div style={{ fontSize:"0.79rem", color:"rgba(248,250,252,0.55)", lineHeight:1.5 }}>Get a reminder to review what happened and whether the situation resolved.</div>
                  </div>
                  {!showFollowUp && !followUpSet && (
                    <button style={{ ...s.btn(false), fontSize:"0.76rem", borderColor:"rgba(251,191,36,0.35)", color:"#fbbf24", flexShrink:0 }} onClick={()=>setShowFollowUp(true)}>Set reminder</button>
                  )}
                </div>
                {showFollowUp && !followUpSet && (
                  <div style={{ marginTop:12 }}>
                    <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                      <input type="email" className="email-input" placeholder="your@email.com" value={followUpEmail} onChange={e=>setFollowUpEmail(e.target.value)} style={{ flex:1, minWidth:160, background:"rgba(255,255,255,0.06)", border:"1px solid rgba(251,191,36,0.3)", borderRadius:8, padding:"9px 12px", color:"#f8fafc", fontSize:"0.87rem", fontFamily:"inherit", outline:"none" }} />
                      <button style={{ ...s.btn(false), borderColor:"rgba(251,191,36,0.4)", color:"#fbbf24", background:"rgba(251,191,36,0.08)" }} onClick={saveFollowUp} disabled={!followUpEmail.includes("@")}>Save</button>
                    </div>
                    <div style={{ fontSize:"0.73rem", color:"rgba(251,191,36,0.6)", marginTop:6 }}>Reminder saved locally. You'll see it when you open the tool on or after your 30-day mark.</div>
                  </div>
                )}
                {followUpSet && (
                  <div style={{ marginTop:10, fontSize:"0.8rem", color:"rgba(251,191,36,0.85)", fontWeight:600 }}>Reminder set. Come back in 30 days to close the loop.</div>
                )}
              </div>
            </div>
          );
        })()}

        {/* History */}
        {history.length>0 && (
          <div style={{ marginTop:24, borderTop:"1px solid rgba(255,255,255,0.07)", paddingTop:18 }}>
            <span style={s.label}>Session history</span>
            {history.map((e,i)=>(
              <div key={i} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, background:"rgba(255,255,255,0.04)", border:"1px solid rgba(255,255,255,0.07)", borderRadius:9, padding:"9px 13px", fontSize:"0.82rem", marginBottom:6 }}>
                <div style={{ display:"flex", alignItems:"center", gap:9 }}>
                  <div style={{ width:7, height:7, borderRadius:"50%", background:C[e.level].text, flexShrink:0 }} />
                  <div><div style={{ fontWeight:600 }}>{META[e.scenario].icon} {e.scenario}</div><div style={{ fontSize:"0.72rem", color:"#8899aa" }}>{e.time}</div></div>
                </div>
                <div style={{ fontSize:"0.65rem", fontWeight:700, textTransform:"uppercase", letterSpacing:"0.04em", padding:"2px 7px", borderRadius:4, background:C[e.level].bg, color:C[e.level].text }}>{e.level==="good"?"Low Risk":e.level==="warn"?"Elevated":"High Risk"}</div>
              </div>
            ))}
          </div>
        )}

        <div style={{ marginTop:28, textAlign:"center", fontSize:"0.74rem", color:"#8899aa", lineHeight:1.8 }}>
          General guidance only — not legal advice.<br />
          Your progress and company policies save automatically to this browser.<br />
          © 2025 Melissa A. Weiss. All rights reserved.
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
