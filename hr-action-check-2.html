async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

const META = {
  "Performance Decline":      { icon:"📉", riskLevel:"medium", riskLabel:"Moderate Risk", description:"A team member is not meeting expected standards of work output, quality, or behavior. Very manageable when handled with clear documentation and consistent communication.", examples:["An employee who consistently missed quarterly targets despite coaching conversations over three months.","A team member whose work quality dropped since returning from a leave of absence.","Someone who used to be a strong performer but has been disengaged and error-prone for six weeks.","An employee who repeatedly submits reports late after multiple reminders.","A customer-facing employee receiving escalating complaints about attitude or responsiveness.","A team member who stops contributing in meetings and misses collaborative deadlines.","An employee whose output volume dropped significantly without a clear explanation.","Someone who was coached verbally twice and is now making the same errors again."], docTips:["Send a follow-up email after every coaching conversation summarizing what was discussed and what is expected.","Use a simple log: date, what you observed, what you said, how the employee responded.","Save any examples of substandard work — reports, emails, error logs — as attachments.","Document goals in writing before any review period begins so expectations are clear.","Note any explanation the employee gave and whether it was substantiated."], watch:"Performance issues that began after an accommodation request, leave, or protected disclosure create legal exposure and must be handled carefully.", contactHR:"If you are unsure whether the performance issue is connected to a medical condition, leave, or a recent complaint — stop and contact HR before doing anything else." },
  "Attendance Issue":         { icon:"⏰", riskLevel:"medium", riskLabel:"Moderate Risk", description:"An employee is frequently absent, late, or leaving early in a pattern affecting their work and team. Straightforward when policy is clear — complex when protected leave is involved.", examples:["An employee who has called out 8 times in 10 weeks with no medical documentation.","Someone consistently 30–45 minutes late despite two prior verbal conversations.","Absences that cluster around Mondays and Fridays in a recurring pattern.","An employee who leaves early several times a week without prior approval.","A team member whose unplanned absences are causing coverage gaps for the rest of the team.","Someone who has exhausted their PTO balance and continues calling out.","An employee who calls out frequently but refuses to provide any explanation.","A remote employee who is repeatedly unavailable during core hours without notice."], docTips:["Keep a running attendance log with exact dates, times, and any reason given by the employee.","Note when you notified the employee and what their response was — in writing, even a quick email.","Save any documentation the employee provided (doctor's notes, text messages, emails).","Record whether each absence was excused or unexcused per your policy.","If a pattern is emerging (e.g. always Mondays), note the pattern explicitly in your log."], watch:"Absences that may qualify as FMLA, ADA accommodations, or state-protected leave. Disciplining an employee for protected absences is one of the most common HR legal mistakes.", contactHR:"If the employee has mentioned a health condition, family care responsibility, or anything that sounds like it could be protected — contact HR before issuing any discipline." },
  "Interpersonal Conflict":   { icon:"🤝", riskLevel:"medium", riskLabel:"Moderate Risk", description:"Two or more employees are in conflict through disagreements or friction affecting the team dynamic. Most conflicts are manageable. Some escalate into harassment or hostile workplace territory.", examples:["Two team members who had a heated argument in a meeting and are no longer speaking.","An employee complaining that a peer is undermining them in front of clients.","A group dynamic where one person is being excluded from team communication.","A manager receiving complaints from multiple employees about one person's behavior.","Two employees who work closely together but have reached a point of open hostility.","A team member who is passive-aggressively sabotaging a colleague's projects.","A newer employee complaining that a tenured peer is dismissive and demeaning.","Conflict that started as a work disagreement and has become personal."], docTips:["Write a brief summary of what each party told you — separately — including dates and specific quotes where possible.","Document any witnesses who observed the behavior.","Note any prior incidents, even informal complaints you heard but did not formally log.","Record the outcome of any mediation or coaching conversation in writing and share it with both parties.","Keep a timeline: when the conflict started, key incidents, what actions you took, and outcomes."], watch:"Patterns of behavior targeting someone based on a protected characteristic. What looks like a personality conflict may legally be harassment.", contactHR:"If any part of the conflict involves comments about race, gender, age, disability, religion, or any protected characteristic — treat it as a potential harassment matter and contact HR immediately." },
  "Policy Violation":         { icon:"⚠️", riskLevel:"medium", riskLabel:"Moderate Risk", description:"An employee has violated a written or established workplace policy. The response depends on severity, whether it was a first offense, and whether the policy has been applied consistently.", examples:["An employee who used company equipment for personal business in violation of the IT policy.","Someone who shared confidential client information externally without authorization.","A team member who bypassed a safety protocol resulting in a near-miss incident.","An employee who falsified time records.","Someone who violated the social media policy by posting about a client.","A manager who failed to follow the required approval process for a significant purchase.","An employee caught accessing systems or files outside their authorized scope.","Someone who violated the workplace conduct policy through inappropriate language or behavior."], docTips:["Save a copy of the policy that was violated, including the version and date the employee signed or acknowledged it.","Write a factual description of the violation: what happened, when, who observed it, what evidence exists.","Document how you became aware of the issue and any investigation steps you took.","Note whether this is a first offense or whether there is a prior discipline history.","Record any mitigating explanation the employee offered."], watch:"Selective enforcement. If you discipline one employee for a violation but have tolerated the same behavior from others, you create disparate treatment risk.", contactHR:"If you are not certain the policy applies clearly to this situation, or if similar behavior has been overlooked in the past — contact HR before taking action." },
  "Termination Consideration": { icon:"🚪", riskLevel:"high", riskLabel:"High Risk", description:"You are considering ending an employee's employment. This is the highest-stakes management decision you will make and carries significant legal exposure if not handled correctly.", examples:["An employee who failed to meet goals outlined in a formal Performance Improvement Plan.","Someone who violated a zero-tolerance policy (harassment, theft, falsifying records).","A long-tenured employee whose role is being eliminated as part of a restructuring.","An employee who has received multiple written warnings and continues the same behavior.","Someone whose conduct in a single incident was severe enough to warrant immediate termination.","An employee who abandoned their position without notice or explanation.","A manager whose team filed multiple substantiated complaints about their leadership.","Someone who failed a drug or background screening that is a condition of employment."], docTips:["Compile the full disciplinary history in chronological order: verbal warnings, written warnings, PIP, and outcomes.","Confirm in writing that the employee received, signed, and had a chance to respond to each step.","Document the specific reason for termination in one clear sentence — this will appear in official records.","Note the date HR and/or legal reviewed and cleared the termination.","Prepare a separation checklist: final pay, equipment return, benefit end dates, COBRA notice, access revocation."], watch:"Any termination where the employee recently filed a complaint, requested accommodation, took protected leave, or belongs to a protected class.", contactHR:"Contact HR before scheduling the meeting, before saying anything to the employee, and before preparing any paperwork. No termination should move forward without HR sign-off." },
  "Accommodation Request":    { icon:"♿", riskLevel:"high", riskLabel:"High Risk", description:"An employee has requested a change to their work conditions due to a disability, medical condition, or religious belief. The law requires an interactive process — ignoring or dismissing the request is not an option.", examples:["An employee with a back condition requesting a standing desk or modified workstation.","A team member with anxiety disorder requesting reduced travel or remote work.","An employee requesting schedule modifications for religious observance.","Someone requesting additional break time due to a chronic health condition.","An employee returning from medical leave who cannot perform all previous job functions.","A team member with a hearing impairment requesting captioning for all video meetings.","An employee with ADHD requesting written instructions and deadline reminders.","Someone requesting a private space for medical treatment during the workday."], docTips:["Document the date and method of the request — even if it was verbal, note it in writing the same day.","Record every step of the interactive process: who was involved, what was discussed, what options were explored.","Keep copies of any medical documentation provided, stored securely and separately from the employee's general file.","Document the accommodation decision and the specific rationale in writing.","If accommodation is denied, document why — and have legal review that rationale before communicating it."], watch:"Treating an accommodation request informally or verbally without documentation. Delay and inaction are both forms of denial under the law.", contactHR:"Contact HR the same day any accommodation request is made — even if the employee frames it casually. The legal clock starts when the need is expressed, not when a formal form is submitted." },
  "Harassment / Discrimination": { icon:"🛑", riskLevel:"high", riskLabel:"High Risk", description:"An employee has reported being harassed or discriminated against based on a protected characteristic. This triggers immediate obligations and the complainant must be protected from retaliation immediately.", examples:["An employee reports their manager made repeated comments about their age and ability to 'keep up.'","A team member alleges they were passed over for promotion due to their race.","An employee reports unwanted physical contact or sexually suggestive comments from a colleague.","Someone reports being excluded from meetings or opportunities after disclosing a pregnancy.","An employee complains about a pattern of demeaning jokes targeting their national origin.","A team member reports that their manager created a hostile environment after they disclosed a disability.","An employee says they were threatened or intimidated for reporting a prior concern.","Someone reports being assigned lesser work or fewer opportunities than peers of a different gender."], docTips:["Write down the complaint exactly as reported — use the employee's own words wherever possible.","Note the date, time, location, and method of the complaint (in person, email, etc.).","Document the names of any witnesses mentioned and any evidence the employee referenced.","Record every investigation step: who was interviewed, when, what they said, and what documentation was reviewed.","Preserve all relevant emails, messages, and records. Do not allow anything to be deleted."], watch:"Any action that could be interpreted as punishing the person who raised the complaint. Retaliation claims are often more costly than the underlying complaint.", contactHR:"Contact HR immediately — before responding to the employee, before speaking to the accused, and before taking any action. This is not optional." },
  "Retaliation Concern":      { icon:"🔁", riskLevel:"high", riskLabel:"High Risk", description:"You are considering an adverse action against an employee who recently engaged in protected activity — filing a complaint, requesting accommodation, taking leave, or participating in an investigation.", examples:["A manager wants to put an employee on a PIP two weeks after that employee filed an HR complaint.","An employee who testified in an investigation is suddenly moved to a less desirable shift.","A high performer who requested FMLA leave receives their first negative review one month later.","An employee who reported a safety violation is excluded from a project they previously led.","A team member who requested an accommodation is passed over for a promotion with no documented rationale.","An employee who filed an EEOC charge is suddenly subject to new performance monitoring.","A manager attempts to reassign an employee's responsibilities after they raised a pay equity concern.","An employee who participated in a harassment investigation notices a sudden change in their manager's behavior toward them."], docTips:["Document the timeline explicitly: when did the protected activity occur, and when did the adverse action arise.","Write down the business rationale for the adverse action and confirm it predates the protected activity.","Gather evidence that the performance or conduct issue was documented before the complaint was filed.","Note who else made the decision and ensure there is more than one person's input documented.","Record that HR and/or legal reviewed and approved the action before it was taken."], watch:"The 'temporal proximity' problem. Courts treat close timing between protected activity and adverse action as evidence of retaliation.", contactHR:"Do not take any adverse action — including a conversation, a schedule change, or a performance warning — without HR and legal review first. The risk here is significant." },
  "Reduction in Force":       { icon:"📋", riskLevel:"high", riskLabel:"High Risk", description:"You are eliminating positions due to business need. An RIF requires documented selection criteria, adverse impact analysis, and compliance with notice obligations.", examples:["A company eliminating a product line and laying off the associated team.","A department restructuring that consolidates three roles into two.","A budget-driven reduction affecting 10% of headcount across multiple teams.","A merger that creates redundant functions across two organizations.","A company closing a regional office and eliminating all positions at that location.","An organization shifting from in-house to outsourced functions, eliminating internal roles.","A startup that raised less funding than expected and must reduce burn rate immediately.","A restructuring where layers of management are removed to flatten the organization."], docTips:["Define and document selection criteria before any names are identified — criteria must be neutral and job-related.","Run an adverse impact analysis on the selected population before the RIF is finalized.","Prepare a written business rationale for the RIF that does not reference any individual's performance.","Document the separation terms, severance calculations, and legal review of all agreements.","Keep records of WARN Act analysis, notice timelines, and any required state-specific filings."], watch:"A selection pool where employees selected for separation are disproportionately from a protected group. This requires legal review before the RIF is announced.", contactHR:"HR and employment counsel must be involved from the beginning. Do not identify individuals, set dates, or communicate anything internally until the full process has been reviewed and cleared." },
  "Leave of Absence":         { icon:"🗓️", riskLevel:"medium", riskLabel:"Moderate Risk", description:"An employee needs extended time off for medical, family, personal, or other reasons. Different leave types carry different legal protections. Getting the leave type wrong is a common and costly error.", examples:["An employee requesting 6 weeks off following a surgery with a slow recovery.","A team member needing intermittent leave to care for a parent with a chronic illness.","An employee who has exhausted PTO and is asking for unpaid leave due to a mental health condition.","A new parent requesting leave beyond what the company's paid policy covers.","An employee called to active military duty requiring extended absence.","A team member experiencing a pregnancy complication requiring immediate time off.","An employee requesting leave to care for a seriously ill child or spouse.","Someone requesting a personal leave of absence for reasons unrelated to a medical condition."], docTips:["Record the date the employee first communicated the need for leave — even informally.","Document which leave type(s) apply and the basis for that determination.","Log all paperwork sent and received, including dates and delivery method.","Keep a record of any medical certifications, including when they were requested and received.","Document the return-to-work date, any extensions granted, and whether an accommodation review was conducted."], watch:"Assuming a leave request is just a 'time off' issue. Many leaves trigger FMLA, ADA, state leave law, or all three simultaneously.", contactHR:"If you are not certain which leave law applies — or if the employee has a medical condition involved in any way — contact HR before responding to the request." }
};

const QS = {
  "Performance Decline":      [{q:"Have performance expectations been clearly communicated in writing?",hint:"Verbal expectations alone are harder to defend. Look for emails, job descriptions, goal-setting documents, or meeting notes.",weight:2,critical:false},{q:"Has this issue been documented in prior conversations or reviews?",hint:"A first documented conversation is fine — just make sure it is documented. Verbal-only history creates risk.",weight:1,critical:false},{q:"Has the employee been given a clear opportunity to respond to concerns?",hint:"This means a real conversation, not just an email. The employee should be able to explain context.",weight:1,critical:false},{q:"Is the performance decline consistent and ongoing (not a single incident)?",hint:"A pattern over time is stronger than one bad week. Consider whether something changed.",weight:1,critical:false},{q:"Are there known leave, medical, or accommodation factors at play?",hint:"If yes, or if you're not sure, stop and consult HR before taking any action.",weight:2,critical:true}],
  "Attendance Issue":         [{q:"Is there a written attendance policy the employee has acknowledged?",hint:"Without a clear policy, enforcement is difficult to defend. Check your employee handbook.",weight:2,critical:false},{q:"Has the pattern been documented with dates and frequency?",hint:"A log of specific dates and context provided matters enormously if this progresses to discipline.",weight:1,critical:false},{q:"Has the employee been formally notified that attendance is an issue?",hint:"A documented conversation is required before formal discipline.",weight:1,critical:false},{q:"Have you confirmed that no protected leave applies to these absences?",hint:"FMLA, ADA, state sick leave, and other protections can cover absences you might otherwise count.",weight:2,critical:true},{q:"Has the policy been enforced consistently across your team?",hint:"If you have tolerated similar patterns from others, disciplining one person exposes you to disparate treatment claims.",weight:2,critical:false}],
  "Interpersonal Conflict":   [{q:"Have you gathered facts from all parties involved, not just the complainant?",hint:"Acting on one person's account without hearing others is a procedural mistake.",weight:2,critical:false},{q:"Have you given each affected employee an opportunity to be heard?",hint:"This protects both the process and the employees.",weight:1,critical:false},{q:"Is the behavior materially affecting work output, team function, or the work environment?",hint:"Personality differences are not automatically an HR matter.",weight:1,critical:false},{q:"Are there prior documented incidents involving these individuals?",hint:"A pattern changes the situation significantly.",weight:1,critical:false},{q:"Is the situation escalating or involving behavior tied to a protected characteristic?",hint:"If the behavior involves race, gender, age, religion, or other protected characteristics, this may be harassment.",weight:2,critical:true}],
  "Policy Violation":         [{q:"Is the policy written, accessible, and clearly worded?",hint:"Employees must have had reasonable access to the policy before the violation occurred.",weight:2,critical:false},{q:"Has this policy been applied consistently to others in similar situations?",hint:"Disciplining one person for a violation while ignoring the same behavior from others is a disparate treatment risk.",weight:2,critical:true},{q:"Would the employee reasonably have understood that this behavior violated policy?",hint:"Even with a written policy, enforcement requires the employee could reasonably have known this applied.",weight:1,critical:false},{q:"Is this a first offense, or is there prior disciplinary history?",hint:"Most progressive discipline frameworks require different responses for first vs. repeat violations.",weight:1,critical:false},{q:"Are there mitigating circumstances that warrant consideration before acting?",hint:"Long tenure, clean history, personal circumstances, or policy ambiguity are factors attorneys will ask about.",weight:1,critical:false}],

  "Accommodation Request":    [{q:"Has the accommodation request been acknowledged and documented in writing?",hint:"Even a verbal request triggers obligations. The interactive process begins when the need is expressed.",weight:1,critical:false},{q:"Have you initiated the interactive process with the employee?",hint:"The interactive process means a real, documented conversation about what the employee needs. It is legally required.",weight:2,critical:true},{q:"Has HR or legal been informed and involved?",hint:"Accommodation decisions should not be made by a manager alone.",weight:2,critical:true},{q:"Have you obtained the necessary medical documentation (if applicable)?",hint:"You can request documentation confirming the need — but only ask for what is directly relevant.",weight:1,critical:false},{q:"Have you assessed whether accommodation creates undue hardship?",hint:"Undue hardship is a high legal bar. Most accommodations do not meet this threshold.",weight:1,critical:false}],
  "Harassment / Discrimination": [{q:"Has the complaint been documented and acknowledged to the complainant?",hint:"The employee must know their complaint was received and taken seriously.",weight:1,critical:false},{q:"Is HR or legal already involved in this situation?",hint:"Non-negotiable for harassment and discrimination complaints.",weight:2,critical:true},{q:"Has the complainant been informed of their protections against retaliation?",hint:"This is a required communication in most jurisdictions. It should happen at the outset, in writing.",weight:1,critical:false},{q:"Is a neutral investigation underway or formally planned?",hint:"An investigation must be prompt, thorough, and conducted by someone without a conflict of interest.",weight:2,critical:true},{q:"Are the parties currently separated to minimize further harm while the investigation proceeds?",hint:"This may mean schedule adjustments or remote work — but must not punish the complainant.",weight:1,critical:false}],
  "Retaliation Concern":      [{q:"Has the employee engaged in protected activity within the past 12 months?",hint:"Protected activity includes: filing an HR complaint, requesting accommodation, taking FMLA, participating in an investigation.",weight:2,critical:true},{q:"Is the adverse action you are considering closely timed to that activity?",hint:"Courts consider anything within a few weeks to a few months as potentially suspicious.",weight:2,critical:true},{q:"Has HR or legal reviewed the proposed action and its timing?",hint:"No adverse action should proceed in this context without independent review.",weight:2,critical:true},{q:"Is there documented, non-retaliatory business rationale that predates the protected activity?",hint:"If the issue existed before the complaint, show documentation that proves it.",weight:1,critical:false},{q:"Has the employee been informed of their anti-retaliation rights?",hint:"Most federal and state laws require this communication.",weight:1,critical:false}],
  "Reduction in Force":       [{q:"Is there a documented, legitimate business rationale for the RIF?",hint:"Budget reduction, restructuring, role elimination — the reason must be real and documentable.",weight:2,critical:false},{q:"Were the selection criteria defined and applied consistently before individuals were identified?",hint:"Selection criteria must be established before you run the names.",weight:2,critical:true},{q:"Has legal reviewed the selection pool for adverse impact?",hint:"Run the statistical analysis: what percentage of each protected group is affected?",weight:2,critical:true},{q:"Have WARN Act obligations been assessed (for US employers)?",hint:"50+ employees laid off in 30 days at a single site may trigger 60-day advance notice requirements.",weight:2,critical:true},{q:"Are severance agreements and required disclosures prepared and legally reviewed?",hint:"Agreements offering severance in exchange for a release of claims must meet specific legal requirements.",weight:1,critical:false}],

};

const STEPS = {
  "Performance Decline":      {good:["Schedule a documented performance conversation this week with specific examples.","Issue a written memo confirming expectations, the gap, and what success looks like. Get a signature.","Set a structured check-in date 2–4 weeks out and put it on the calendar."],warn:["Review your documentation for completeness before scheduling any meeting.","Consult HR before issuing a formal PIP — confirm the process, timeline, and language.","Assess whether any accommodation or leave factors need to be cleared before proceeding."],risk:["Stop. Do not schedule any disciplinary meeting until HR has reviewed the full situation.","Pull together all documentation and present it to HR for a legal risk assessment.","Do not take any adverse action until cleared."]},

function computeScore(qs, answers) {
  let wNo=0,total=0,crit=false,unk=0,yes=0,no=0;
  qs.forEach((item,i)=>{ const a=answers[i]; total+=item.weight; if(a==="yes")yes++; if(a==="no"){no++;wNo+=item.weight;if(item.critical)crit=true;} if(a==="unknown"){unk++;wNo+=item.weight*0.75;if(item.critical)crit=true;} });
  const ratio=wNo/total;
  return { level:crit?"risk":ratio<=0.15?"good":ratio<=0.45?"warn":"risk", crit, unk, yes, no };
}

// ── PIN Gate Component ───────────────────────────────────────────────────
function PinGate({ onUnlock, mode }) {
  // mode: "enter" | "change"
  const [pin, setPin]           = useState("");
  const [newPin, setNewPin]     = useState("");
  const [confirmPin, setConfirm]= useState("");
  const [error, setError]       = useState("");
  const [shakeKey, setShakeKey] = useState(0);
  const [changing, setChanging] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => { inputRef.current && inputRef.current.focus(); }, [changing]);

  const triggerShake = () => { setShakeKey(k=>k+1); };

  const handleUnlock = async () => {
    const hash = await sha256(pin);
    const stored = loadPinHash();
    if (hash === stored) { onUnlock(); }
    else { setError("Incorrect PIN."); setPin(""); triggerShake(); }
  };

  const handleChange = async () => {
    if (newPin.length < 4) { setError("PIN must be at least 4 characters."); return; }
    if (newPin !== confirmPin) { setError("PINs do not match."); triggerShake(); return; }
    const currentHash = await sha256(pin);
    const stored = loadPinHash();
    if (currentHash !== stored) { setError("Current PIN is incorrect."); setPin(""); triggerShake(); return; }
    const newHash = await sha256(newPin);
    savePinHash(newHash);
    onUnlock();
  };

  const s = {
    wrap: { padding:"24px 22px", textAlign:"center" },
    lockIcon: { fontSize:"2rem", marginBottom:12 },
    title: { fontSize:"0.9rem", fontWeight:700, color:"#f8fafc", marginBottom:6 },
    sub: { fontSize:"0.78rem", color:"#8899aa", lineHeight:1.5, marginBottom:18 },
    input: { width:"100%", background:"rgba(255,255,255,0.06)", border:"1px solid rgba(255,255,255,0.12)", borderRadius:9, padding:"10px 14px", color:"#f8fafc", fontSize:"0.9rem", fontFamily:"inherit", outline:"none", textAlign:"center", letterSpacing:"0.2em", marginBottom:10 },
    btn: (primary) => ({ width:"100%", padding:"10px", borderRadius:999, border:primary?"1px solid rgba(34,193,255,0.45)":"1px solid rgba(255,255,255,0.1)", background:primary?"rgba(34,193,255,0.12)":"rgba(255,255,255,0.04)", color:primary?"#22c1ff":"#f8fafc", cursor:"pointer", fontSize:"0.82rem", fontWeight:600, fontFamily:"inherit", marginBottom:8 }),
    err: { fontSize:"0.77rem", color:"#fb7185", marginBottom:10, minHeight:18 },
    link: { fontSize:"0.72rem", color:"rgba(34,193,255,0.55)", cursor:"pointer", background:"none", border:"none", fontFamily:"inherit", padding:0, marginTop:4 },
  };

  if (!changing) return (
    <div style={s.wrap}>
      <div style={s.lockIcon}>🔒</div>
      <div style={s.title}>HR Access Only</div>
      <div style={s.sub}>Enter your HR PIN to upload or manage company policies. Default PIN is 1234 — change it after first login.</div>
      <div key={shakeKey} className={shakeKey ? "shake" : ""}>
        <input ref={inputRef} style={s.input} type="password" placeholder="Enter PIN" value={pin} onChange={e=>{ setPin(e.target.value); setError(""); }} onKeyDown={e=>e.key==="Enter"&&handleUnlock()} maxLength={20} />
      </div>
      <div style={s.err}>{error}</div>
      <button style={s.btn(true)} onClick={handleUnlock}>Unlock</button>
      <button style={s.link} onClick={()=>{ setChanging(true); setError(""); setPin(""); }}>Change PIN</button>
    </div>
  );

  return (
    <div style={s.wrap}>
      <div style={s.lockIcon}>🔑</div>
      <div style={s.title}>Change HR PIN</div>
      <div style={s.sub}>Enter your current PIN, then set a new one.</div>
      <input style={s.input} type="password" placeholder="Current PIN" value={pin} onChange={e=>{ setPin(e.target.value); setError(""); }} maxLength={20} />
      <input style={s.input} type="password" placeholder="New PIN (min 4 characters)" value={newPin} onChange={e=>{ setNewPin(e.target.value); setError(""); }} maxLength={20} />
      <div key={shakeKey} className={shakeKey ? "shake" : ""}>
        <input style={s.input} type="password" placeholder="Confirm new PIN" value={confirmPin} onChange={e=>{ setConfirm(e.target.value); setError(""); }} onKeyDown={e=>e.key==="Enter"&&handleChange()} maxLength={20} />
      </div>
      <div style={s.err}>{error}</div>
      <button style={s.btn(true)} onClick={handleChange}>Save new PIN</button>
      <button style={s.link} onClick={()=>{ setChanging(false); setError(""); }}>Back</button>
    </div>
  );
}

function PolicyLibrary({ policies, setPolicies, onClose, currentScenario }) {
  const [tab, setTab]               = useState("view");
  const [unlocked, setUnlocked]     = useState(false);
  const [pasteText, setPasteText]   = useState("");
  const [pasteName, setPasteName]   = useState("");
  const [pasteCategory, setPasteCat]= useState("handbook");
  const [dragActive, setDragActive] = useState(false);
  const [viewDoc, setViewDoc]       = useState(null);
  const [editingId, setEditingId]   = useState(null);
  const [showReset, setShowReset]   = useState(false);
  const fileRef = useRef(null);

  const readFile = (file) => new Promise((resolve) => {
    const reader = new FileReader();
    if (file.type === "application/pdf" || file.name.match(/\.pdf$/i)) {
      reader.onload = (e) => {
        const matches = (e.target.result || "").match(/[^\x00-\x1F\x7F-\xFF]{4,}/g) || [];
        const extracted = matches.filter(s=>s.trim().length>3).join(" ").substring(0,50000);
        resolve({ name:file.name, text:extracted||"[PDF uploaded. Text extraction is limited — for best results, use Paste Text instead.]", size:file.size });
      };
      reader.readAsBinaryString(file);
    } else {
      reader.onload = (e) => resolve({ name:file.name, text:e.target.result||"", size:file.size });
      reader.readAsText(file);
    }
  });

  const handleFiles = async (files) => {
    const results = [];
    for (const file of Array.from(files)) {
      if (file.size > 5*1024*1024) { alert(`${file.name} is over 5MB. Please paste the text directly.`); continue; }
      const { name, text } = await readFile(file);
      const lower = (name+" "+text.substring(0,500)).toLowerCase();
      let autoCategory = "other";
      if (lower.match(/attendance|absent|tardiness|late|leave policy/)) autoCategory = "attendance";
      else if (lower.match(/performance|pip|improvement|coaching|discipline/)) autoCategory = "performance";
      else if (lower.match(/handbook|code of conduct|workplace policy/)) autoCategory = "handbook";
      else if (lower.match(/accommodat|ada|disability|reasonable/)) autoCategory = "accommodation";
      else if (lower.match(/termination|separation|severance|rif|layoff/)) autoCategory = "separation";
      else if (lower.match(/harassment|discrimination|eeoc|complaint/)) autoCategory = "conduct";
      results.push({ id:Date.now()+Math.random(), name, text, category:autoCategory, addedAt:new Date().toLocaleDateString(), chars:text.length });
    }
    if (results.length) { const u=[...policies,...results]; setPolicies(u); savePolicies(u); setTab("view"); }
  };

  const addPaste = () => {
    if (!pasteText.trim()) return;
    const doc = { id:Date.now(), name:pasteName.trim()||"Pasted policy "+(policies.length+1), text:pasteText.trim(), category:pasteCategory, addedAt:new Date().toLocaleDateString(), chars:pasteText.trim().length };
    const u=[...policies,doc]; setPolicies(u); savePolicies(u); setPasteText(""); setPasteName(""); setTab("view");
  };

  const removeDoc = (id) => {
    const u=policies.filter(p=>p.id!==id); setPolicies(u); savePolicies(u);
    if (viewDoc&&viewDoc.id===id) setViewDoc(null);
  };

  const updateCategory = (id, cat) => { const u=policies.map(p=>p.id===id?{...p,category:cat}:p); setPolicies(u); savePolicies(u); };

  const handleReset = () => {
    if (!window.confirm("This will delete all stored policies and reset the PIN to 1234. This cannot be undone.")) return;
    savePolicies([]); setPolicies([]); savePinHash(DEFAULT_PIN_HASH);
    setShowReset(false); setUnlocked(false); setTab("view");
  };

  const relevantDocs = currentScenario
    ? policies.filter(p=>{ const cat=POLICY_CATEGORIES.find(c=>c.id===p.category); return cat&&(cat.scenarios.includes(currentScenario)||cat.id==="handbook"||cat.id==="other"); })
    : policies;

  const s = {
    overlay: { position:"fixed", inset:0, background:"rgba(2,6,23,0.88)", zIndex:1000, display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"20px 16px", overflowY:"auto" },
    modal:   { width:"100%", maxWidth:680, background:"linear-gradient(160deg,#0a1628,#060f1e)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:18, overflow:"hidden", marginTop:8 },
    header:  { padding:"18px 22px", borderBottom:"1px solid rgba(255,255,255,0.07)", display:"flex", alignItems:"center", justifyContent:"space-between" },
    tab:     (active) => ({ padding:"7px 14px", borderRadius:999, border:"none", cursor:"pointer", fontSize:"0.78rem", fontWeight:600, fontFamily:"inherit", background:active?"rgba(34,193,255,0.15)":"transparent", color:active?"#22c1ff":"#8899aa", transition:"all .15s", position:"relative" }),
    btn:     (primary) => ({ padding:primary?"9px 18px":"7px 14px", borderRadius:999, border:primary?"1px solid rgba(34,193,255,0.45)":"1px solid rgba(255,255,255,0.1)", background:primary?"rgba(34,193,255,0.12)":"rgba(255,255,255,0.04)", color:primary?"#22c1ff":"#f8fafc", cursor:"pointer", fontSize:"0.8rem", fontWeight:600, fontFamily:"inherit" }),
    input:   { width:"100%", background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:8, padding:"9px 12px", color:"#f8fafc", fontSize:"0.83rem", fontFamily:"inherit", outline:"none" },
    select:  { background:"rgba(255,255,255,0.05)", border:"1px solid rgba(255,255,255,0.1)", borderRadius:8, padding:"7px 10px", color:"#f8fafc", fontSize:"0.8rem", fontFamily:"inherit", outline:"none", cursor:"pointer" },

  );

  return (

              {policies.length===0 ? "No documents on file" : `${policies.length} document${policies.length!==1?"s":""} stored in this browser`}
            </div>
          </div>
          <button onClick={onClose} style={s.btn(false)}>Close</button>
        </div>

        {/* Tabs */}
        <div style={{ display:"flex", gap:4, padding:"12px 22px 0", borderBottom:"1px solid rgba(255,255,255,0.07)", overflowX:"auto" }}>
          <button style={s.tab(tab==="view")} onClick={()=>{ setTab("view"); setViewDoc(null); }}>
            View Policies {policies.length>0&&<span style={{ marginLeft:4, fontSize:"0.68rem", background:"rgba(255,255,255,0.1)", padding:"1px 5px", borderRadius:99 }}>{policies.length}</span>}
          </button>
          <button style={s.tab(tab==="upload")} onClick={()=>setTab("upload")}>
            Upload Files {lockBadge}
          </button>
          <button style={s.tab(tab==="paste")} onClick={()=>setTab("paste")}>
            Paste Text {lockBadge}
          </button>
          <button style={s.tab(tab==="dashboard")} onClick={()=>setTab("dashboard")}>
            HR Dashboard {lockBadge}
          </button>
        </div>

        <div style={{ padding:"20px 22px" }}>

          {/* VIEW TAB — always open */}
          {tab==="view" && (
            <div>
              {policies.length===0 ? (
                <div style={{ textAlign:"center", padding:"32px 0", color:"#8899aa" }}>
                  <div style={{ fontSize:"2rem", marginBottom:8 }}>📁</div>
                  <div style={{ fontSize:"0.88rem" }}>No policies on file yet.</div>
                  <div style={{ fontSize:"0.79rem", marginTop:6, color:"#667788" }}>HR can add documents using the Upload or Paste tabs.</div>
                </div>
              ) : viewDoc ? (
                <div>
                  <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>

                    : <div style={{ display:"flex", gap:8, alignItems:"center" }}>

          {/* PASTE TAB — PIN gated */}
          {tab==="paste" && (

                    {POLICY_CATEGORIES.map(c=><option key={c.id} value={c.id}>{c.label}</option>)}
                  </select>
                </div>
                <div style={{ marginBottom:12 }}>
                  <div style={{ fontSize:"0.7rem", color:"#8899aa", textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:5 }}>Policy text</div>
                  <textarea rows={10} style={{ ...s.input, resize:"vertical" }} placeholder="Paste your policy text here..." value={pasteText} onChange={e=>setPasteText(e.target.value)} />
                </div>
                <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:16 }}>
                  <button style={s.btn(true)} onClick={addPaste} disabled={!pasteText.trim()}>Save to library</button>
                  <span style={{ fontSize:"0.74rem", color:"#8899aa" }}>{pasteText.length.toLocaleString()} characters</span>
                </div>
                <div style={{ borderTop:"1px solid rgba(255,255,255,0.06)", paddingTop:14, display:"flex", gap:8 }}>

                </div>
              </div>
            )

          {/* DASHBOARD TAB — PIN gated */}
          {tab==="dashboard" && (
            !unlocked ? <PinGate onUnlock={()=>setUnlocked(true)} /> : (
              <HRDashboard s={s} lockBadge={lockBadge} />

      </div>
    </div>
  );
}

// ── HR Dashboard Component ───────────────────────────────────────────────
function HRDashboard({ s }) {
  const [inbox, setInbox]         = useState([]);
  const [hrEmail, setHrEmail]     = useState("");
  const [hrEmailInput, setHrEmailInput] = useState("");
  const [viewEntry, setViewEntry] = useState(null);
  const [filter, setFilter]       = useState("all");
  const [saved, setSaved]         = useState(false);

  useEffect(() => {
    setInbox(loadHRInbox());
    const e = loadHREmail();
    setHrEmail(e);
    setHrEmailInput(e);
  }, []);

  const saveEmail = () => {
    saveHREmail(hrEmailInput.trim());
    setHrEmail(hrEmailInput.trim());
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const setStatus = (id, status) => {
    const updated = inbox.map(e => e.id===id ? {...e, status} : e);
    setInbox(updated);
    saveHRInbox(updated);
    if (viewEntry && viewEntry.id===id) setViewEntry({...viewEntry, status});
  };

  const removeEntry = (id) => {
    const updated = inbox.filter(e => e.id!==id);
    setInbox(updated);
    saveHRInbox(updated);
    if (viewEntry && viewEntry.id===id) setViewEntry(null);
  };

  const filtered = filter==="all" ? inbox : filter==="open" ? inbox.filter(e=>e.status==="open"||!e.status) : filter==="high" ? inbox.filter(e=>e.level==="risk") : inbox.filter(e=>e.status==="resolved");
  const openHigh = inbox.filter(e=>(e.status==="open"||!e.status)&&e.level==="risk").length;
  const openAll  = inbox.filter(e=>e.status==="open"||!e.status).length;

  const statusColors = { open:"#fbbf24", resolved:"#34d399" };
  const levelLabel = l => l==="good"?"Low Risk":l==="warn"?"Elevated":l==="risk"?"High Risk":"";

  if (viewEntry) {
    const eqs = QS[viewEntry.scenario];
    const col = C[viewEntry.level];
    const st2 = STEPS[viewEntry.scenario][viewEntry.level];
    return (
      <div>
        <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
          <button style={s.btn(false)} onClick={()=>setViewEntry(null)}>Back</button>
          <div style={{ fontWeight:700, fontSize:"0.9rem" }}>{META[viewEntry.scenario].icon} {viewEntry.scenario}</div>
          <span style={{ fontSize:"0.65rem", fontWeight:700, textTransform:"uppercase", padding:"2px 7px", borderRadius:4, background:col.bg, color:col.text, border:`1px solid ${col.border}` }}>{levelLabel(viewEntry.level)}</span>
        </div>
        <div style={{ fontSize:"0.78rem", color:"#8899aa", marginBottom:4 }}>{viewEntry.managerName&&<span style={{ color:"rgba(248,250,252,0.7)", marginRight:8 }}>{viewEntry.managerName}</span>}{viewEntry.date} at {viewEntry.time}</div>
        <div style={{ display:"flex", gap:8, marginBottom:14, flexWrap:"wrap" }}>
          <button style={{ ...s.btn(viewEntry.status!=="resolved"), fontSize:"0.76rem", color: viewEntry.status==="resolved"?"#34d399":"#f8fafc", borderColor: viewEntry.status==="resolved"?"rgba(52,211,153,0.4)":"rgba(255,255,255,0.1)" }} onClick={()=>setStatus(viewEntry.id, viewEntry.status==="resolved"?"open":"resolved")}>
            {viewEntry.status==="resolved" ? "Resolved" : "Mark resolved"}
          </button>
          <button style={{ ...s.btn(false), fontSize:"0.76rem", color:"#fb7185", borderColor:"rgba(251,113,133,0.2)" }} onClick={()=>{ removeEntry(viewEntry.id); setViewEntry(null); }}>Remove</button>
        </div>
        <div style={{ borderTop:"1px solid rgba(255,255,255,0.07)", paddingTop:12, marginBottom:12 }}>
          {eqs.map((item,i)=>{
            const a=viewEntry.answers[i]; const aLabel=a==="yes"?"Yes":a==="no"?"No":"Don't know";
            const aColor=a==="yes"?"#34d399":a==="no"?"#fb7185":"#fbbf24";
            return (
              <div key={i} style={{ borderBottom:"1px solid rgba(255,255,255,0.05)", paddingBottom:9, marginBottom:9 }}>
                <div style={{ fontSize:"0.82rem", lineHeight:1.45, color:"rgba(248,250,252,0.8)", marginBottom:3 }}>{item.q}{item.critical&&<span style={{ marginLeft:6, fontSize:"0.6rem", fontWeight:700, textTransform:"uppercase", background:"rgba(251,113,133,0.12)", border:"1px solid rgba(251,113,133,0.3)", color:"#fb7185", borderRadius:4, padding:"1px 5px" }}>Critical</span>}</div>
                <div style={{ fontSize:"0.78rem", fontWeight:700, color:aColor }}>{aLabel}</div>

              </div>

          })}
        </div>
        <div style={{ borderTop:"1px solid rgba(255,255,255,0.07)", paddingTop:12 }}>
          <div style={{ fontSize:"0.68rem", letterSpacing:"0.07em", textTransform:"uppercase", color:"#8899aa", marginBottom:8 }}>Recommended next steps</div>
          {st2.map((st,i)=>(
            <div key={i} style={{ display:"flex", gap:8, fontSize:"0.81rem", lineHeight:1.5, color:"rgba(248,250,252,0.7)", marginBottom:5 }}>

            </div>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div>
      {/* HR contact email config */}

        <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>

          <button style={s.btn(true)} onClick={saveEmail}>{saved?"Saved!":"Save"}</button>
        </div>
        {hrEmail&&<div style={{ fontSize:"0.74rem", color:"rgba(52,211,153,0.8)", marginTop:6 }}>Current: {hrEmail}</div>}
      </div>

      {/* Summary counts */}
      <div style={{ display:"flex", gap:8, marginBottom:14, flexWrap:"wrap" }}>
        {[["all","All",inbox.length,"#8899aa"],["open","Open",openAll,"#fbbf24"],["high","High Risk",openHigh,"#fb7185"],["resolved","Resolved",inbox.filter(e=>e.status==="resolved").length,"#34d399"]].map(([val,label,count,color])=>(
          <button key={val} onClick={()=>setFilter(val)} style={{ padding:"5px 12px", borderRadius:999, border:`1px solid ${filter===val?color+"55":"rgba(255,255,255,0.1)"}`, background:filter===val?color+"15":"rgba(255,255,255,0.03)", color:filter===val?color:"#8899aa", cursor:"pointer", fontSize:"0.75rem", fontWeight:600, fontFamily:"inherit" }}>
            {label} {count>0&&<span style={{ marginLeft:3, opacity:0.8 }}>{count}</span>}
          </button>
        ))}
      </div>

      {/* Inbox list */}
      {filtered.length===0 ? (
        <div style={{ textAlign:"center", padding:"32px 0", color:"#8899aa" }}>
          <div style={{ fontSize:"2rem", marginBottom:8 }}>📥</div>
          <div style={{ fontSize:"0.88rem" }}>{inbox.length===0?"No checks sent to HR yet.":"No checks match this filter."}</div>

        filtered.map((e,i)=>{
